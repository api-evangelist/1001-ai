aid: 1001-ai
name: 1001 AI
description: >-
  1001 (also known as 1001 AI) is a deeptech artificial intelligence company
  founded in 2025 by Bilal Abu-Ghazaleh, a former director of generative AI
  operations at Scale AI, and headquartered between London and Dubai. The
  company builds sovereign AI operating systems for critical infrastructure —
  live operational models that help operators across aviation and airports,
  ports and logistics, energy and grids, construction, and manufacturing
  predict issues, automate and optimize decisions, and improve operational
  efficiency, while retaining full local ownership and governance of their AI
  systems. Focused primarily on the GCC and wider MENA region, 1001 raised a
  $9 million seed round in October 2025 led by CIV, General Catalyst, and Lux
  Capital, followed by a $30 million Series A in June 2026 led by Lux Capital
  with Sanabil Investments, 9Yards, and Hanabi joining and existing backers
  General Catalyst, CIV, and Stanford AI researcher Chris Ré increasing their
  commitments. As of this profile, 1001 publishes no public API, developer
  documentation, or SDK; this entry captures the company's public identity and
  web properties for the API Evangelist network.
